version: 2
updates:
  # Python packages (requirements.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Base image in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
