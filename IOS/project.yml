name: RecipeManager
options:
  bundleIdPrefix: com.justinrahme
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  RecipeManager:
    type: application
    platform: iOS
    sources: [RecipeManager, Shared]
    dependencies:
      - target: RecipeManagerTimerWidget
        embed: true
      - target: RecipeManagerShare
        embed: true
    entitlements:
      path: RecipeManager/RecipeManager.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.justinrahme.RecipeManager.shared"]
    info:
      path: RecipeManager/Resources/Info.plist
      properties:
        CFBundleDisplayName: Recipes
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: Kitchen timers ring like the Clock app, even when your phone is on silent.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinrahme.RecipeManager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  RecipeManagerTimerWidget:
    type: app-extension
    platform: iOS
    sources: [TimerWidget, Shared]
    info:
      path: TimerWidget/Info.plist
      properties:
        CFBundleDisplayName: Kitchen Timer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinrahme.RecipeManager.TimerWidget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
  RecipeManagerShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: Shared/Credentials.swift
      - path: Shared/SharedContent.swift
      - path: RecipeManager/Core/APIClient.swift
      - path: RecipeManager/Core/Models.swift
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.justinrahme.RecipeManager.shared"]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Recipes
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinrahme.RecipeManager.Share
        SKIP_INSTALL: YES
  RecipeManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RecipeManagerTests]
    dependencies:
      - target: RecipeManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinrahme.RecipeManagerTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RecipeManager:
    build:
      targets:
        RecipeManager: all
        RecipeManagerTests: [test]
    test:
      targets: [RecipeManagerTests]
