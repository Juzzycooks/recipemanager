name: RecipeManager
options:
  bundleIdPrefix: com.justinrahme
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team here (or choose it once in Xcode → Signing & Capabilities):
    # DEVELOPMENT_TEAM: ABCDE12345
    TARGETED_DEVICE_FAMILY: "1"                 # iPhone only (the iPad layout has not been designed or tested)
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO   # don't offer the iPhone app on Apple-silicon Macs ...
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO    # ... or Apple Vision Pro until it has been tried there
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  RecipeManager:
    type: application
    platform: iOS
    sources: [RecipeManager, Shared]
    dependencies:
      - target: RecipeManagerTimerWidget
        embed: true
      - target: RecipeManagerShare
        embed: true
    entitlements:
      path: RecipeManager/RecipeManager.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.justinrahme.RecipeManager.shared"]
    info:
      path: RecipeManager/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Spoonmate
        UILaunchScreen:
          UIColorName: Background                # the cream/dark ground, so there is no white flash at launch
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Spoonmate connects to the recipe server you choose. If it runs on your home network, iOS asks for this permission so the app can reach it.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: Kitchen timers ring like the Clock app, even when your phone is on silent.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinrahme.RecipeManager
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RecipeManagerTimerWidget:
    type: app-extension
    platform: iOS
    sources: [TimerWidget, Shared]
    info:
      path: TimerWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Kitchen Timer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinrahme.RecipeManager.TimerWidget
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
  RecipeManagerShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: Shared/Credentials.swift
      - path: Shared/SharedContent.swift
      - path: RecipeManager/Core/APIClient.swift
      - path: RecipeManager/Core/Models.swift
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.justinrahme.RecipeManager.shared"]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Spoonmate
        NSLocalNetworkUsageDescription: Spoonmate connects to the recipe server you choose. If it runs on your home network, iOS asks for this permission so the app can reach it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinrahme.RecipeManager.Share
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  RecipeManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RecipeManagerTests]
    dependencies:
      - target: RecipeManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinrahme.RecipeManagerTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RecipeManager:
    build:
      targets:
        RecipeManager: all
        RecipeManagerTests: [test]
    test:
      targets: [RecipeManagerTests]
