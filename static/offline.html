<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/fonts.css">
<script>(function(){var t=null;try{t=localStorage.getItem('theme');}catch(e){}if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); padding: 1.5rem; }
  main { max-width: 26rem; text-align: center; }
  h1 { font-family: var(--font-display); font-size: 2.25rem; margin: 0 0 0.5rem; }
  p { color: var(--text-secondary); line-height: 1.6; margin: 0 0 1.25rem; }
  a { display: inline-block; background: var(--accent-solid); color: #fff; padding: 0.7rem 1.25rem; border-radius: var(--radius); font-weight: 600; text-decoration: none; min-height: 44px; box-sizing: border-box; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>This page hasn't been saved on this device yet. Recipes you've opened before, their cook mode, your shopping list and the meal plan stay available without a connection.</p>
  <a href="/">Back to your recipes</a>
</main>
</body>
</html>
