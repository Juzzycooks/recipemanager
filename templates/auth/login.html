{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/tools.css', v=asset_v) }}">{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <h1>Log in</h1>
        <p class="auth-subtitle">Sign in to your account</p>
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>
        <p class="auth-footer"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p>
        <p class="auth-footer">Need an account? Contact your administrator.</p>
    </div>
</div>
{% endblock %}
