{% extends "base.html" %}
{% block title %}{{ calc.name }}{% endblock %}
{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
<div style="display:flex;align-items:center;gap:0.5rem;">
<a href="{{ url_for('calculators.index') }}" class="btn btn-secondary btn-sm">&larr;</a>
<h2 style="font-size:var(--fs-md);">{{ calc.name }}</h2>
</div>
<a href="{{ calc.url }}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm">Open in new tab</a>
</div>
<div class="card" style="padding:0;overflow:hidden;">
<iframe src="{{ calc.url }}" style="width:100%;height:80vh;border:none;display:block;"
title="{{ calc.name }}" loading="lazy"
sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</div>
{% endblock %}
