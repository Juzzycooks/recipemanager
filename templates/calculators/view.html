{% extends "base.html" %}
{% block title %}{{ calc.name }}{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/tools.css', v=asset_v) }}">{% endblock %}
{% block content %}
<div class="frame-head">
<div class="row-tools">
<a href="{{ url_for('calculators.index') }}" class="btn btn-secondary btn-sm" aria-label="Back to calculators">
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Calculators</a>
<h2>{{ calc.name }}</h2>
</div>
<a href="{{ calc.url }}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm">Open in new tab</a>
</div>
<div class="card frame-card">
<iframe src="{{ calc.url }}" class="tool-frame" title="{{ calc.name }}" loading="lazy"
sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</div>
{% endblock %}
